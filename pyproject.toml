[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lapprox"
version = "0.1.0"
description = "Lightweight Laplace approximation for Bayesian model comparison."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Corey Beard", email = "coreycbeard@gmail.com" }]
keywords = ["laplace-approximation", "bayesian", "model-comparison", "evidence", "astronomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
rv = ["pandas", "radvel"]
docs = ["sphinx", "sphinx-rtd-theme"]
dev = ["pytest", "ruff", "lapprox[docs]"]

[project.urls]
Homepage = "https://github.com/CCBeard/LApprox"
Documentation = "https://lapprox.readthedocs.io"
Repository = "https://github.com/CCBeard/LApprox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.ipynb", "docs/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
